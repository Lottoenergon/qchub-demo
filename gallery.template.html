<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QC Hub · Canvas export</title>
<style>
@font-face{font-family:Inter;src:url('./assets/inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#182230;font:13px Inter,system-ui,sans-serif}header{padding:20px 24px;background:white;border-bottom:1px solid #e4e7ec;display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:20px;margin:0}header small{color:#667085}a{color:#2563eb;text-decoration:none}header a{margin-left:auto}.layout{display:grid;grid-template-columns:290px minmax(0,1fr)}aside{height:calc(100vh - 80px);overflow:auto;padding:18px 12px;border-right:1px solid #e4e7ec;background:white;position:sticky;top:0}input{width:100%;padding:12px;border:1px solid #e4e7ec;border-radius:8px;margin-bottom:14px;font:inherit}button{font:inherit;cursor:pointer}aside button{display:block;text-align:left;width:100%;padding:12px;border:0;border-radius:6px;background:white;color:#475467;line-height:1.5}aside button[aria-current=true]{background:#eff4ff;color:#2563eb}aside button:hover{background:#f5f7fa}main{padding:24px;min-width:0}.toolbar{display:flex;gap:14px;align-items:center;margin-bottom:20px;flex-wrap:wrap}h2{font-size:16px;margin:0}select{font:inherit;padding:8px;border:1px solid #e4e7ec;border-radius:6px;background:white}.stage{overflow:auto;width:100%;min-height:600px}.scaled{position:relative}iframe{border:0;background:white;transform-origin:top left;position:absolute;top:0;left:0;box-shadow:0 0 0 1px #e4e7ec}#size{color:#667085}#open{margin-left:auto}@media(max-width:700px){.layout{grid-template-columns:minmax(0,1fr)}aside{height:220px;position:static;border-bottom:1px solid #e4e7ec}main{padding:16px}header{padding:16px}.stage{min-height:300px}}
</style>
</head>
<body>
<header><h1>QC Hub · Canvas export</h1><small id="count"></small><a href="./QCHUB.pen" download>Unduh sumber .pen</a></header>
<div class="layout"><aside><input type="search" id="filter" placeholder="Cari layar atau varian…" aria-label="Cari layar"><nav aria-label="Layar desain" id="screens"></nav></aside><main><div class="toolbar"><h2 id="title"></h2><span id="size"></span><label>Zoom <select id="zoom" aria-label="Zoom preview"><option value="fit">Fit</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option></select></label><a id="open" target="_blank" rel="noopener">Buka layar asli ↗</a></div><div class="stage"><div class="scaled"><iframe title="Pratinjau desain QC Hub"></iframe></div></div></main></div>
<script>
const screens=__SCREENS__;
const nav=document.querySelector('#screens'), frame=document.querySelector('iframe'), stage=document.querySelector('.stage'), scaled=document.querySelector('.scaled'), zoom=document.querySelector('#zoom');
let current=screens.find(s=>s.id===location.hash.slice(1))||screens.find(s=>s.id==='y8cNK')||screens[0];
document.querySelector('#count').textContent=`${screens.length} frame · desktop, mobile & komponen`;
function resize(){const ratio=zoom.value==='fit'?Math.min(1,(stage.clientWidth-2)/current.width):Number(zoom.value);frame.style.width=current.width+'px';frame.style.height=current.height+'px';frame.style.transform=`scale(${ratio})`;scaled.style.width=current.width*ratio+'px';scaled.style.height=current.height*ratio+'px'}
function renderNav(){nav.replaceChildren();for(const s of screens.filter(s=>s.name.toLowerCase().includes(document.querySelector('#filter').value.toLowerCase()))){const b=document.createElement('button');b.type='button';b.textContent=s.name;b.setAttribute('aria-current',String(current.id===s.id));b.onclick=()=>select(s);nav.append(b)}}
function select(s){current=s;location.hash=s.id;frame.src=s.export;document.querySelector('#title').textContent=s.name;document.querySelector('#size').textContent=`${s.width} × ${s.height}`;document.querySelector('#open').href=s.export;renderNav();resize()}
document.querySelector('#filter').oninput=renderNav;zoom.onchange=resize;new ResizeObserver(resize).observe(stage);select(current);
</script>
</body></html>
